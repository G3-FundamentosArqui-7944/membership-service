spring.application.name=membership-service
server.port=8083
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://localhost:5433/membership_db
spring.datasource.username=bodymatch
spring.datasource.password=YOALAYA
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=com.bodymatch.membership.shared.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:8083/api/v1/subscriptions/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8083/api/v1/subscriptions/cancel}

logging.level.com.bodymatch.membership=DEBUG
